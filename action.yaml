---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# maven-xml-settings-action
name: "🔧 Maven XML Settings"
description: "Generate a Maven settings.xml from supplied parameters"

inputs:
  server-ids:
    # yamllint disable-line rule:line-length
    description: "Optional Maven server <id> values sharing the credentials (comma, space or newline separated); requires username and password"
    required: false
    default: ""
  username:
    # yamllint disable-line rule:line-length
    description: "Optional username applied to every listed server; requires password and server-ids"
    required: false
    default: ""
  password:
    # yamllint disable-line rule:line-length
    description: "Optional password applied to every listed server; requires username and server-ids"
    required: false
    default: ""
  mirror-id:
    description: "Optional mirror <id>; requires mirror-url to take effect"
    required: false
    default: ""
  mirror-url:
    description: "Optional mirror <url>; requires mirror-id to take effect"
    required: false
    default: ""
  mirror-of:
    description: "Mirror <mirrorOf> selector (only used when a mirror is set)"
    required: false
    default: "*"
  profile-id:
    # yamllint disable-line rule:line-length
    description: "Optional active profile <id>; requires profile-repository-url to take effect"
    required: false
    default: ""
  profile-repository-url:
    # yamllint disable-line rule:line-length
    description: "Repository URL for the active profile; requires profile-id to take effect"
    required: false
    default: ""
  settings-path:
    # yamllint disable-line rule:line-length
    description: "Path to write settings.xml to (defaults to a file under RUNNER_TEMP)"
    required: false
    default: ""

outputs:
  settings-content:
    description: "The generated settings.xml content"
    value: ${{ steps.generate.outputs.settings-content }}
  settings-path:
    description: "Filesystem path the settings.xml was written to"
    value: ${{ steps.generate.outputs.settings-path }}

runs:
  using: "composite"
  steps:
    - name: "Generate Maven settings.xml"
      id: generate
      shell: bash
      env:
        SERVER_IDS: ${{ inputs.server-ids }}
        SERVER_USERNAME: ${{ inputs.username }}
        SERVER_PASSWORD: ${{ inputs.password }}
        MIRROR_ID: ${{ inputs.mirror-id }}
        MIRROR_URL: ${{ inputs.mirror-url }}
        MIRROR_OF: ${{ inputs.mirror-of }}
        PROFILE_ID: ${{ inputs.profile-id }}
        PROFILE_REPOSITORY_URL: ${{ inputs.profile-repository-url }}
        SETTINGS_PATH: ${{ inputs.settings-path }}
      run: |
        # Generate a Maven settings.xml from the supplied parameters
        set -euo pipefail

        # The generated settings.xml may hold credentials, so restrict new
        # files and directories to the current user. Disable pathname
        # expansion too, so a server id containing *, ? or [] cannot glob
        # to filenames when the id list is word-split below.
        umask 077
        set -f

        # Mask the password in logs regardless of how it was sourced.
        # Percent-encode %, CR and LF first: the workflow-command parser
        # treats those characters specially, so an unescaped value would
        # be masked incompletely (leaking part of the secret).
        if [ -n "$SERVER_PASSWORD" ]; then
          mask=${SERVER_PASSWORD//'%'/'%25'}
          mask=${mask//$'\r'/'%0D'}
          mask=${mask//$'\n'/'%0A'}
          echo "::add-mask::$mask"
        fi

        # Validate inputs before generating anything. Server credentials
        # are optional (a mirror or profile-only document is valid), but
        # username and password must come as a pair.
        if [ -n "$SERVER_USERNAME" ] && [ -n "$SERVER_PASSWORD" ]; then
          has_credentials=true
        elif [ -z "$SERVER_USERNAME" ] && [ -z "$SERVER_PASSWORD" ]; then
          has_credentials=false
        else
          echo "Error: supply username and password together ❌"
          exit 1
        fi

        # settings-path becomes a single-line GITHUB_OUTPUT entry; a CR or
        # LF in it could inject additional outputs, so reject them.
        case "$SETTINGS_PATH" in
          *[$'\r\n']*)
            echo "Error: settings-path must not contain newlines ❌"
            exit 1
            ;;
        esac

        # Server IDs may be comma, space or newline separated. Normalise
        # the list once. With credentials, confirm it yields at least one
        # non-empty id; a value made up solely of separators would
        # otherwise generate an empty <servers> block that silently drops
        # the credentials. Without credentials, reject any server-ids
        # content: the action has nothing to put in those <server> entries.
        normalized_ids=$(printf '%s' "$SERVER_IDS" | tr ',\r\n' '   ')
        server_id_count=0
        # shellcheck disable=SC2086
        for server_id in $normalized_ids; do
          [ -n "$server_id" ] && server_id_count=$((server_id_count + 1))
        done
        if [ "$has_credentials" = true ]; then
          if [ "$server_id_count" -eq 0 ]; then
            echo "Error: server-ids must contain at least one id ❌"
            exit 1
          fi
        elif [ -n "${SERVER_IDS//[[:space:]]/}" ]; then
          echo "Error: server-ids requires username and password ❌"
          exit 1
        fi

        # Mirror and profile blocks render when both of their fields are
        # set. Refuse to write a document with no content at all.
        render_mirror=false
        if [ -n "$MIRROR_ID" ] && [ -n "$MIRROR_URL" ]; then
          render_mirror=true
        fi
        render_profile=false
        if [ -n "$PROFILE_ID" ] && [ -n "$PROFILE_REPOSITORY_URL" ]; then
          render_profile=true
        fi
        if [ "$has_credentials" = false ] && [ "$render_mirror" = false ] \
          && [ "$render_profile" = false ]; then
          echo "Error: set server credentials, a mirror or a profile ❌"
          exit 1
        fi

        # XML-escape element text so credentials or IDs containing &, <
        # or > cannot corrupt the document or inject extra elements.
        xml_escape() {
          printf '%s' "$1" \
            | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
        }

        if [ "$has_credentials" = true ]; then
          esc_user=$(xml_escape "$SERVER_USERNAME")
          esc_pass=$(xml_escape "$SERVER_PASSWORD")
        fi

        settings_file="${SETTINGS_PATH:-${RUNNER_TEMP:-/tmp}/settings.xml}"

        # Ensure the parent directory exists so writing the file cannot
        # fail when the caller supplies a settings-path under a directory
        # that has not been created yet.
        settings_dir=$(dirname -- "$settings_file")
        mkdir -p -- "$settings_dir"

        {
          echo '<settings>'
          # Maven's settings schema makes <servers> optional, so omit the
          # block entirely when there are no credentials to hold.
          if [ "$has_credentials" = true ]; then
            echo '  <servers>'
            # Server IDs were normalised and validated above.
            # Intentionally unquoted: the list must word-split into IDs.
            # shellcheck disable=SC2086
            for server_id in $normalized_ids; do
              [ -n "$server_id" ] || continue
              esc_id=$(xml_escape "$server_id")
              echo '    <server>'
              echo "      <id>${esc_id}</id>"
              echo "      <username>${esc_user}</username>"
              echo "      <password>${esc_pass}</password>"
              echo '    </server>'
            done
            echo '  </servers>'
          fi

          if [ "$render_mirror" = true ]; then
            esc_mirror_id=$(xml_escape "$MIRROR_ID")
            esc_mirror_url=$(xml_escape "$MIRROR_URL")
            esc_mirror_of=$(xml_escape "${MIRROR_OF:-*}")
            echo '  <mirrors>'
            echo '    <mirror>'
            echo "      <id>${esc_mirror_id}</id>"
            echo "      <mirrorOf>${esc_mirror_of}</mirrorOf>"
            echo "      <url>${esc_mirror_url}</url>"
            echo '    </mirror>'
            echo '  </mirrors>'
          fi

          if [ "$render_profile" = true ]; then
            esc_profile_id=$(xml_escape "$PROFILE_ID")
            esc_repo_url=$(xml_escape "$PROFILE_REPOSITORY_URL")
            echo '  <profiles>'
            echo '    <profile>'
            echo "      <id>${esc_profile_id}</id>"
            echo '      <repositories>'
            echo '        <repository>'
            echo "          <id>${esc_profile_id}</id>"
            echo "          <url>${esc_repo_url}</url>"
            echo '          <releases><enabled>true</enabled></releases>'
            echo '          <snapshots><enabled>true</enabled></snapshots>'
            echo '        </repository>'
            echo '      </repositories>'
            echo '      <pluginRepositories>'
            echo '        <pluginRepository>'
            echo "          <id>${esc_profile_id}</id>"
            echo "          <url>${esc_repo_url}</url>"
            echo '          <releases><enabled>true</enabled></releases>'
            echo '          <snapshots><enabled>true</enabled></snapshots>'
            echo '        </pluginRepository>'
            echo '      </pluginRepositories>'
            echo '    </profile>'
            echo '  </profiles>'
            echo '  <activeProfiles>'
            echo "    <activeProfile>${esc_profile_id}</activeProfile>"
            echo '  </activeProfiles>'
          fi

          echo '</settings>'
        } > "$settings_file"

        # Emit the settings content as a step output using a randomised
        # heredoc delimiter so the XML cannot terminate the block early.
        # Regenerate the delimiter until it is provably absent from the
        # generated file, so a value that happens to contain the delimiter
        # cannot close the output block prematurely.
        delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
        while grep -qF -- "$delimiter" "$settings_file"; do
          delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
        done
        {
          echo "settings-content<<${delimiter}"
          cat -- "$settings_file"
          echo "${delimiter}"
          echo "settings-path=${settings_file}"
        } >> "$GITHUB_OUTPUT"

        echo "Generated Maven settings.xml at: ${settings_file}"
