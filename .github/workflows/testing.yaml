---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action (${{ matrix.case }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10 # Increase this timeout value as needed
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full credentials: the output must stay byte-for-byte identical
          # to the v0.1.1 release, captured in the fixture file.
          - case: "full-credentials"
            server-ids: |
              test-releases
              test-snapshots
              nexus3.example.org:10003
            username: "test-user"
            password: "p@ss&<>word"
            expect-servers: "true"
          # No credentials: a mirror and profile-only document.
          - case: "mirror-profile-only"
            server-ids: ""
            username: ""
            password: ""
            expect-servers: "false"
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Perform setup prior to running test(s)
      - name: "Testing setup step"
        shell: bash
        run: |
          # Testing setup step
          echo "Testing setup step"
          echo "Testing setup step/summary output" >> "$GITHUB_STEP_SUMMARY"

      - name: "Running local action: ${{ github.repository }}"
        id: settings
        uses: $/
        with:
          server-ids: ${{ matrix.server-ids }}
          username: ${{ matrix.username }}
          password: ${{ matrix.password }}
          mirror-id: "public"
          mirror-url: "https://nexus.example.org/public/"
          profile-id: "public"
          profile-repository-url: "https://nexus.example.org/public/"

      - name: "Validated local action: ${{ github.repository }}"
        shell: bash
        env:
          SETTINGS_CONTENT: ${{ steps.settings.outputs.settings-content }}
          SETTINGS_PATH: ${{ steps.settings.outputs.settings-path }}
          EXPECTED_FILE: "tests/fixtures/${{ matrix.case }}.xml"
          EXPECT_SERVERS: ${{ matrix.expect-servers }}
        run: |
          # Validate the generated settings.xml
          set -euo pipefail

          if [ ! -s "$SETTINGS_PATH" ]; then
            echo "Error: settings file was not written ❌"; exit 1
          fi

          # The generated document must be well-formed XML. Parse it with
          # Python's standard library, which every runner ships, instead of
          # xmllint (libxml2-utils is no longer preinstalled on ubuntu).
          python3 -c 'import sys, xml.dom.minidom as m; m.parse(sys.argv[1])' \
            "$SETTINGS_PATH" \
            || { echo "Error: settings.xml is not well-formed ❌"; exit 1; }

          # The document must match the expected fixture byte for byte.
          if ! cmp -- "$EXPECTED_FILE" "$SETTINGS_PATH"; then
            diff -u -- "$EXPECTED_FILE" "$SETTINGS_PATH" || true
            echo "Error: settings.xml differs from ${EXPECTED_FILE} ❌"
            exit 1
          fi

          if [ "$EXPECT_SERVERS" = "true" ]; then
            # Every listed server must appear, credentials must be
            # present, and the special characters in the password must
            # be escaped.
            for id in test-releases test-snapshots nexus3.example.org:10003
            do
              grep -qF "<id>${id}</id>" "$SETTINGS_PATH" \
                || { echo "Error: server '${id}' missing ❌"; exit 1; }
            done
            grep -qF '<password>p@ss&amp;&lt;&gt;word</password>' \
              "$SETTINGS_PATH" \
              || { echo "Error: password not XML-escaped ❌"; exit 1; }
          else
            # Without credentials there must be no server data at all.
            for tag in '<servers>' '<server>' '<username>' '<password>'; do
              if grep -qF "$tag" "$SETTINGS_PATH"; then
                echo "Error: unexpected ${tag} without credentials ❌"
                exit 1
              fi
            done
          fi
          grep -qF '<mirrorOf>*</mirrorOf>' "$SETTINGS_PATH" \
            || { echo "Error: mirror missing ❌"; exit 1; }
          grep -qF '<activeProfile>public</activeProfile>' "$SETTINGS_PATH" \
            || { echo "Error: active profile missing ❌"; exit 1; }

          # The output string must match the written file.
          if [ "$SETTINGS_CONTENT" != "$(cat "$SETTINGS_PATH")" ]; then
            echo "Error: settings-content output differs from file ❌"
            exit 1
          fi

          echo "Validated local action: generated settings.xml is valid ✅"
          echo "Validation step summary output" >> "$GITHUB_STEP_SUMMARY"

  ### Invalid input combinations must fail with a clear error ###
  failures:
    name: "Test input validation (${{ matrix.case }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10 # Increase this timeout value as needed
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: "no-inputs"
            server-ids: ""
            username: ""
            password: ""
            mirror-id: ""
            mirror-url: ""
            error: "Error: set server credentials, a mirror or a profile"
          - case: "username-without-password"
            server-ids: "test-releases"
            username: "test-user"
            password: ""
            mirror-id: "public"
            mirror-url: "https://nexus.example.org/public/"
            error: "Error: supply username and password together"
          - case: "password-without-username"
            server-ids: "test-releases"
            username: ""
            password: "test-password"
            mirror-id: "public"
            mirror-url: "https://nexus.example.org/public/"
            error: "Error: supply username and password together"
          - case: "server-ids-without-credentials"
            server-ids: "test-releases"
            username: ""
            password: ""
            mirror-id: "public"
            mirror-url: "https://nexus.example.org/public/"
            error: "Error: server-ids requires username and password"
          - case: "credentials-without-server-ids"
            server-ids: ""
            username: "test-user"
            password: "test-password"
            mirror-id: "public"
            mirror-url: "https://nexus.example.org/public/"
            error: "Error: server-ids must contain at least one id"
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - name: "Running local action: ${{ github.repository }} [Override Failure]"
        uses: $/
        id: failure
        continue-on-error: true
        with:
          # Supply an invalid input combination: validation must reject it.
          server-ids: ${{ matrix.server-ids }}
          username: ${{ matrix.username }}
          password: ${{ matrix.password }}
          mirror-id: ${{ matrix.mirror-id }}
          mirror-url: ${{ matrix.mirror-url }}

      # Failure testing is also important
      - name: "Error if step above did NOT fail"
        if: steps.failure.outcome == 'success'
        shell: bash
        run: |
          # Error if step above did NOT fail
          echo "Error: previous test step did NOT fail ❌"
          exit 1

      # The step log of a composite action is not readable from a later
      # step, so run the action's generate script directly with the same
      # inputs and confirm it fails with the documented error message.
      - name: "Check validation error message"
        shell: bash
        env:
          SERVER_IDS: ${{ matrix.server-ids }}
          SERVER_USERNAME: ${{ matrix.username }}
          SERVER_PASSWORD: ${{ matrix.password }}
          MIRROR_ID: ${{ matrix.mirror-id }}
          MIRROR_URL: ${{ matrix.mirror-url }}
          MIRROR_OF: "*"
          PROFILE_ID: ""
          PROFILE_REPOSITORY_URL: ""
          EXPECTED_ERROR: ${{ matrix.error }}
        run: |
          # Check validation error message
          set -euo pipefail

          work=$(mktemp -d)
          yq '.runs.steps[] | select(.id == "generate") | .run' action.yaml \
            > "${work}/generate.sh"

          if GITHUB_OUTPUT="${work}/output" \
            SETTINGS_PATH="${work}/settings.xml" \
            bash "${work}/generate.sh" > "${work}/log" 2>&1; then
            echo "Error: generate script accepted invalid inputs ❌"
            exit 1
          fi
          if ! grep -qF -- "$EXPECTED_ERROR" "${work}/log"; then
            cat -- "${work}/log"
            echo "Error: expected message not found: ${EXPECTED_ERROR} ❌"
            exit 1
          fi
          if [ -e "${work}/settings.xml" ]; then
            echo "Error: settings.xml written despite invalid inputs ❌"
            exit 1
          fi

          echo "Validation rejected inputs with: ${EXPECTED_ERROR} ✅"

  # The Maven releases and Java versions the Java/Maven estate tests
  # against, published by java-workflows for every repository in it.
  versions:
    name: "Java/Maven versions"
    permissions: {}
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/java-workflows/.github/workflows/java-maven-versions.yaml@c0a33e2ec6357244055df8b32aaf78d94e2b9514  # main

  ### Real Maven must authenticate with the generated settings ###
  # The jobs above compare the document with fixtures; only Maven can
  # say whether it honours it. How Maven offers settings credentials
  # has changed between releases (3.10 scopes them to repository
  # origins), so every release and JDK under test deploys and resolves
  # through a repository that refuses any request without them.
  compatibility:
    # yamllint disable-line rule:line-length
    name: "Maven compatibility (Maven ${{ matrix.maven.line }}, JDK ${{ matrix.java }})"
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Maven is installed below rather than taken from the runner
        # image, whose Maven moves on without notice. Each entry
        # carries the archive's digest, pinned where the versions are
        # published rather than fetched beside the tarball, where it
        # would prove only that the download completed.
        maven: ${{ fromJSON(needs.versions.outputs.maven) }}
        java: ${{ fromJSON(needs.versions.outputs.java) }}
    steps:
      # A newer allow-list than the jobs above: setup-java fetches
      # JDKs 22 to 24 through api.adoptium.net, which v0.1.1 predates.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Java ${{ matrix.java }}"
        # yamllint disable-line rule:line-length
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: "Install Maven ${{ matrix.maven.version }}"
        shell: bash
        env:
          MAVEN_VERSION: ${{ matrix.maven.version }}
          MAVEN_SHA512: ${{ matrix.maven.sha512 }}
        run: |
          set -euo pipefail
          name="apache-maven-${MAVEN_VERSION}"
          base="https://repo1.maven.org/maven2/org/apache/maven/apache-maven"
          archive="${RUNNER_TEMP}/${name}-bin.tar.gz"
          curl -sfSL -o "${archive}" \
            "${base}/${MAVEN_VERSION}/${name}-bin.tar.gz"
          echo "${MAVEN_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}/bin" >> "${GITHUB_PATH}"

      - name: "Check the toolchain under test"
        shell: bash
        env:
          WANT_MAVEN: ${{ matrix.maven.version }}
          WANT_JAVA: ${{ matrix.java }}
        run: |
          set -euo pipefail
          version="$(mvn --version)"
          echo "${version}"
          status=0
          if ! grep -qF "Apache Maven ${WANT_MAVEN} (" <<< "${version}"; then
            echo "::error::mvn is not Maven ${WANT_MAVEN}"
            status=1
          fi
          if ! grep -qE "^Java version: ${WANT_JAVA}[.,]" <<< "${version}"; then
            echo "::error::Maven does not run on JDK ${WANT_JAVA}"
            status=1
          fi
          case "${JAVA_HOME:-}" in
            *Temurin*) ;;
            *) echo "::error::JAVA_HOME is not a Temurin JDK"; status=1 ;;
          esac
          exit "${status}"

      # The server answers 401 to any request without these exact
      # credentials, and logs whether each request carried them.
      - name: "Start an authenticating repository"
        id: repo
        shell: bash
        env:
          AUTH_USER: "test-user"
          AUTH_PASSWORD: "p@ss&<>word"
        run: |
          set -euo pipefail
          url="$(.github/scripts/start-auth-repo.sh "${RUNNER_TEMP}/auth-repo" \
            "${RUNNER_TEMP}/auth-repo.port" "${RUNNER_TEMP}/auth-repo.log")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      # The mirror and profile ids are server ids too, so their
      # repositories take the same credentials. The mirror covers one
      # repository id the resolve fixture declares: external:* would
      # exclude localhost, and * would capture Maven Central as well.
      - name: "Generate settings for the repository"
        id: settings
        uses: $/
        with:
          server-ids: |
            xml-settings-snapshots
            xml-settings-mirror
            xml-settings-profile
          username: "test-user"
          password: "p@ss&<>word"
          mirror-id: "xml-settings-mirror"
          mirror-url: "${{ steps.repo.outputs.url }}/mirror"
          mirror-of: "xml-settings-upstream"
          profile-id: "xml-settings-profile"
          profile-repository-url: "${{ steps.repo.outputs.url }}/profile"

      # For the negative control: proves the server enforces the
      # password, so the scenarios that pass mean something.
      - name: "Generate settings with a wrong password"
        id: wrong
        uses: $/
        with:
          server-ids: "xml-settings-snapshots"
          username: "test-user"
          password: "wrong-password"
          settings-path: "${{ runner.temp }}/wrong-settings.xml"

      - name: "Deploy and resolve with the generated settings"
        shell: bash
        env:
          SERVER_URL: ${{ steps.repo.outputs.url }}
          SETTINGS: ${{ steps.settings.outputs.settings-path }}
          WRONG_SETTINGS: ${{ steps.wrong.outputs.settings-path }}
        run: |
          set -euo pipefail
          .github/scripts/maven-scenarios.sh \
            "${RUNNER_TEMP}/auth-repo" "${SERVER_URL}" \
            "${RUNNER_TEMP}/auth-repo.log" "${SETTINGS}" "${WRONG_SETTINGS}"
