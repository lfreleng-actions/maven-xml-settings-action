# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10 # Increase this timeout value as needed
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Perform setup prior to running test(s)
      - name: "Testing setup step"
        shell: bash
        run: |
          # Testing setup step
          echo "Testing setup step"
          echo "Testing setup step/summary output" >> "$GITHUB_STEP_SUMMARY"

      - name: "Running local action: ${{ github.repository }}"
        id: settings
        uses: ./
        with:
          server-ids: |
            test-releases
            test-snapshots
            nexus3.example.org:10003
          username: "test-user"
          password: "p@ss&<>word"
          mirror-id: "public"
          mirror-url: "https://nexus.example.org/public/"
          profile-id: "public"
          profile-repository-url: "https://nexus.example.org/public/"

      - name: "Validated local action: ${{ github.repository }}"
        shell: bash
        env:
          SETTINGS_CONTENT: ${{ steps.settings.outputs.settings-content }}
          SETTINGS_PATH: ${{ steps.settings.outputs.settings-path }}
        run: |
          # Validate the generated settings.xml
          set -euo pipefail

          if [ ! -s "$SETTINGS_PATH" ]; then
            echo "Error: settings file was not written ❌"; exit 1
          fi

          # The generated document must be well-formed XML. Parse it with
          # Python's standard library, which every runner ships, instead of
          # xmllint (libxml2-utils is no longer preinstalled on ubuntu).
          python3 -c 'import sys, xml.dom.minidom as m; m.parse(sys.argv[1])' \
            "$SETTINGS_PATH" \
            || { echo "Error: settings.xml is not well-formed ❌"; exit 1; }

          # Every listed server must appear, credentials must be present,
          # and the special characters in the password must be escaped.
          for id in test-releases test-snapshots nexus3.example.org:10003; do
            grep -qF "<id>${id}</id>" "$SETTINGS_PATH" \
              || { echo "Error: server '${id}' missing ❌"; exit 1; }
          done
          grep -qF '<password>p@ss&amp;&lt;&gt;word</password>' \
            "$SETTINGS_PATH" \
            || { echo "Error: password not XML-escaped ❌"; exit 1; }
          grep -qF '<mirrorOf>*</mirrorOf>' "$SETTINGS_PATH" \
            || { echo "Error: mirror missing ❌"; exit 1; }
          grep -qF '<activeProfile>public</activeProfile>' "$SETTINGS_PATH" \
            || { echo "Error: active profile missing ❌"; exit 1; }

          # The output string must match the written file.
          if [ "$SETTINGS_CONTENT" != "$(cat "$SETTINGS_PATH")" ]; then
            echo "Error: settings-content output differs from file ❌"
            exit 1
          fi

          echo "Validated local action: generated settings.xml is valid ✅"
          echo "Validation step summary output" >> "$GITHUB_STEP_SUMMARY"

      # yamllint disable-line rule:line-length
      - name: "Running local action: ${{ github.repository }} [Override Failure]"
        uses: ./
        id: failure
        continue-on-error: true
        with:
          # Provide empty required inputs: validation must reject them.
          server-ids: ""
          username: ""
          password: ""

      # Failure testing is also important
      - name: "Error if step above did NOT fail"
        if: steps.failure.outcome == 'success'
        shell: bash
        run: |
          # Error if step above did NOT fail
          echo "Error: previous test step did NOT fail ❌"
          exit 1
